# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Maven Publishing Properties
# Do NOT put real credentials here. Pass them with -P flags, put them in
# ~/.gradle/gradle.properties, or export OSSRH_USERNAME / OSSRH_PASSWORD.
# Get a token from https://central.sonatype.com/ -> Account -> Generate User Token
ossrhUsername=
ossrhPassword=

# Artifact coordinates / POM metadata
group=cc.linklab
version=0.1.0
projectDescription=Android SDK for LinkLab dynamic links and deferred deep linking
projectUrl=https://github.com/Linklab-cc/linklab-android-sdk
projectLicenseName=The Apache License, Version 2.0
projectLicenseUrl=http://www.apache.org/licenses/LICENSE-2.0.txt
projectAuthorId=linklab
projectAuthorName=LinkLab
projectAuthorEmail=info@linklab.cc
projectScmConnection=scm:git:git://github.com/Linklab-cc/linklab-android-sdk.git
projectScmDeveloperConnection=scm:git:ssh://github.com/Linklab-cc/linklab-android-sdk.git
projectScmUrl=https://github.com/Linklab-cc/linklab-android-sdk

# Signing properties (keep EMPTY here; supply via -P flags or ~/.gradle/gradle.properties)
signing.keyId=
signing.password=
signing.secretKeyRingFile=
